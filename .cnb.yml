# CNB 云原生构建：push main 后构建 web / backend / yingce-agent 三个镜像，
# 推送到 CNB Docker 制品库。
#
# 制品路径（CNB 非同名制品规则：仓库路径作命名空间，制品名追加在后）：
#   ${CNB_DOCKER_REGISTRY}/cloudcvm/visionaryai/web:<commit>
#   ${CNB_DOCKER_REGISTRY}/cloudcvm/visionaryai/backend:<commit>
#   ${CNB_DOCKER_REGISTRY}/cloudcvm/visionaryai/agent:<commit>
#
# 服务器侧 .env 对应：
#   CANVAS_WEB_IMAGE=${CNB_DOCKER_REGISTRY}/cloudcvm/visionaryai/web:<commit>
#   CANVAS_BACKEND_IMAGE=${CNB_DOCKER_REGISTRY}/cloudcvm/visionaryai/backend:<commit>
#   CANVAS_YINGCE_AGENT_IMAGE=${CNB_DOCKER_REGISTRY}/cloudcvm/visionaryai/agent:<commit>
#
# 国内加速：Go 依赖走 goproxy.cn

main:
  push:
    - services:
        - docker
      stages:
        # ── 登录 CNB Docker 制品库（CNB_TOKEN 缺失则依赖内置凭据）────
        - name: docker login
          script: |
            if [ -n "${CNB_TOKEN}" ]; then
              echo "${CNB_TOKEN}" | docker login ${CNB_DOCKER_REGISTRY} -u cnb --password-stdin
            else
              echo "CNB_TOKEN 不存在，使用流水线内置凭据"
            fi

        # ── 构建 web 镜像 ─────────────────────────────────────────────
        - name: 构建 web 镜像
          script: |
            docker build -f Dockerfile \
              -t ${CNB_DOCKER_REGISTRY}/cloudcvm/visionaryai/web:${CNB_COMMIT_SHORT} .

        # ── 构建 backend 镜像（国内 GOPROXY）─────────────────────────
        - name: 构建 backend 镜像
          script: |
            docker build -f backend/Dockerfile \
              --build-arg GOPROXY=https://goproxy.cn,direct \
              -t ${CNB_DOCKER_REGISTRY}/cloudcvm/visionaryai/backend:${CNB_COMMIT_SHORT} .

        # ── 构建 yingce-agent 镜像 ────────────────────────────────────
        - name: 构建 yingce-agent 镜像
          script: |
            docker build -f yingce-agent/Dockerfile \
              -t ${CNB_DOCKER_REGISTRY}/cloudcvm/visionaryai/agent:${CNB_COMMIT_SHORT} .

        # ── 推送三个镜像到 CNB 制品库 ────────────────────────────────
        - name: 推送镜像
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/cloudcvm/visionaryai/web:${CNB_COMMIT_SHORT}
            docker push ${CNB_DOCKER_REGISTRY}/cloudcvm/visionaryai/backend:${CNB_COMMIT_SHORT}
            docker push ${CNB_DOCKER_REGISTRY}/cloudcvm/visionaryai/agent:${CNB_COMMIT_SHORT}
